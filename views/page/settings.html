<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clean Dashboard Sidebar</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
  />
</head>
<body class="bg-gray-100 font-sans">

  <div class="flex h-screen overflow-hidden">

    <aside class="w-72 bg-white border-r border-gray-200 flex flex-col justify-between shadow-sm">

      <div>
        <div class="px-8 py-6 border-b border-gray-100">
          <h1 class="text-2xl font-bold tracking-tight text-gray-900">
            WT Console
          </h1>
          <p class="text-sm text-gray-500 mt-1">
            Admin Dashboard
          </p>
        </div>

        <nav class="px-4 py-6 space-y-2">

            <a href="home.html"
            class="w-full flex items-center gap-4 px-4 py-3 rounded-2xl hover:bg-gray-100 transition text-left">
              <span class="material-symbols-rounded text-[22px]">dashboard</span>
              <span class="font-medium">Dashboard</span>
            </a>
          
            <a href="clients.html"
            class="w-full flex items-center gap-4 px-4 py-3 rounded-2xl hover:bg-gray-100 transition text-left">
              <span class="material-symbols-rounded text-[22px]">groups</span>
              <span class="font-medium">Clients</span>
            </a>
          
            <a href="plans.html"
            class="w-full flex items-center gap-4 px-4 py-3 rounded-2xl hover:bg-gray-100 transition text-left">
              <span class="material-symbols-rounded text-[22px]">folder_open</span>
              <span class="font-medium">Plans</span>
            </a>
          
            <a href="invoices.html"
            class="w-full flex items-center gap-4 px-4 py-3 rounded-2xl hover:bg-gray-100 transition text-left">
              <span class="material-symbols-rounded text-[22px]">credit_card</span>
              <span class="font-medium">Invoices</span>
            </a>
          
            <a href="messages.html"
            class="w-full flex items-center gap-4 px-4 py-3 rounded-2xl hover:bg-gray-100 transition text-left">
              <span class="material-symbols-rounded text-[22px]">mail</span>
              <span class="font-medium">Messages</span>
            </a>
          
            <a href="analytics.html"
            class="w-full flex items-center gap-4 px-4 py-3 rounded-2xl hover:bg-gray-100 transition text-left">
              <span class="material-symbols-rounded text-[22px]">analytics</span>
              <span class="font-medium">Analytics</span>
            </a>
          
            <a href="settings.html"
            class="w-full flex items-center gap-4 px-4 py-3 rounded-2xl bg-black text-white shadow-md text-left">
              <span class="material-symbols-rounded text-[22px]">settings</span>
              <span class="font-medium">Settings</span>
            </a>
          
          </nav>
      </div>

      <div class="p-4 border-t border-gray-100">
        <div class="flex items-center gap-3 bg-gray-50 p-4 rounded-2xl">
          <div class="w-12 h-12 rounded-full bg-black text-white flex items-center justify-center font-bold">
            JD
          </div>

          <div>
            <p class="font-semibold text-gray-900">User name</p>
            <p class="text-sm text-gray-500">Administrator</p>
          </div>
        </div>
      </div>

    </aside>

    <main class="flex-1 p-10 overflow-auto">

      <div class="bg-white rounded-3xl border border-gray-100 shadow-sm p-10 min-h-full">

        <h2 class="text-3xl font-bold text-gray-900 mb-3">
          Settings
        </h2>

        <button class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-xl" id="logout">Logout</button>
          
        </div>

      </div>  

    </main>

  </div>
  <script type="module" src="../script/homepage.js"></script>
</body>
</html>
