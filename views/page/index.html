<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register & Login</title>
  <link rel="icon" type="image/png" href="../../img/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon/favicon.svg" />
  <link rel="shortcut icon" href="../../assets/img/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="../../assets/img/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="../../assets/img/favicon/site.webmanifest" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="../css/style.css"/>
  <script type="module" src="../script/auth.js"></script>
</head>

<body>

  <div class="container" id="signup" style="display:none;">

    <h1 class="form-title">Register</h1>

    <form>
      <div id="signUpMessage" class="messageDiv" style="display:none;"></div>

      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" id="fName" placeholder="First Name" required>
        <label for="fName">First Name</label>
      </div>

      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" id="lName" placeholder="Last Name" required>
        <label for="lName">Last Name</label>
      </div>

      <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="email" id="rEmail" placeholder="Email" required>
        <label for="rEmail">Email</label>
      </div>

      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="rPassword" placeholder="Password" required>
        <label for="rPassword">Password</label>
      </div>

      <button type="button" class="btn" id="submitSignUp">
        Sign Up
      </button>
    </form>

    <div class="links">
      <p>Already Have Account?</p>
      <a id="signInButton">Sign In</a>
    </div>

  </div>


  <div class="container" id="signIn">

    <h1 class="form-title">Sign In</h1>

    <form>

      <div id="signInMessage" class="messageDiv" style="display:none;"></div>

      <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="email" id="email" placeholder="Email" required>
        <label for="email">Email</label>
      </div>

      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Password" required>
        <label for="password">Password</label>
      </div>
      
      <div class="or">or continue with</div>
      <div class="social-login">
    
        <button type="button" class="social-btn google-btn" id="googleLogin">
          <i class="fa-brands fa-google"></i>
          <span>Continue with Google</span>
        </button>
    
        <button type="button" class="social-btn apple-btn" id="appleLogin">
          <i class="fa-brands fa-apple"></i>
          <span>Continue with Apple</span>
        </button>
    
    </div>

      <button type="button" class="btn" id="submitSignIn">
        Sign In
      </button>

    </form>

    <div class="links">
      <p>Don't have an account yet?</p>
      <a id="signUpButton">Sign Up</a>
    </div>

  </div>

  <script src="../script/script.js"></script>

</body>
</html>
