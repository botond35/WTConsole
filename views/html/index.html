<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WT Console – Sign In</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="../css/style.css"/>
  <script type="module" src="../script/auth.js"></script>
</head>
<body>

  <!-- Sign Up -->
  <div class="container" id="signup" style="display:none;">
    <h1 class="form-title">Register</h1>
    <form>
      <div id="signUpMessage" class="messageDiv" style="display:none;"></div>

      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" id="fName" placeholder="First Name" required>
        <label for="fName">First Name</label>
      </div>

      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" id="lName" placeholder="Last Name" required>
        <label for="lName">Last Name</label>
      </div>

      <div class="input-group">
        <i class="fas fa-paw"></i>
        <input type="text" id="business" placeholder="Business / Clinic Name" required>
        <label for="business">Business / Clinic Name</label>
      </div>

      <div class="input-group">
        <i class="fas fa-users"></i>
        <input type="number" id="teamNumber" value="1" placeholder="Enter Team Number or Solo" required>
        <label for="teamNumber">Team Number / Solo</label>
      </div>

      <div class="input-group">
        <i class="fas fa-phone"></i>
        <input type="tel" id="phone" placeholder="Phone" required>
        <label for="phone">Phone</label>
      </div>

      <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="email" id="rEmail" placeholder="Email" required>
        <label for="rEmail">Email</label>
      </div>

      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="rPassword" placeholder="Password" required>
        <label for="rPassword">Password</label>
      </div>

      <button type="button" id="submitSignUp">Create Account</button>
    </form>
    <div class="links">
      <p>Already have an account?</p>
      <a id="signInButton">Sign In</a>
    </div>
  </div>

  <!-- Sign In -->
  <div class="container" id="signIn">
    <h1 class="form-title">WT Console</h1>

    <form>
      <div id="signInMessage" class="messageDiv" style="display:none;"></div>

      <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="email" id="email" placeholder="Email" required>
        <label for="email">Email</label>
      </div>

      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Password" required>
        <label for="password">Password</label>
      </div>

      <button type="button" id="submitSignIn">Sign In</button>

      <div class="or">or continue with</div>

      <div class="social-login">
        <button type="button" class="social-btn google-btn" id="googleLogin">
          <i class="fa-brands fa-google"></i>
          <span>Continue with Google</span>
        </button>
        <button type="button" class="social-btn apple-btn" id="appleLogin">
          <i class="fa-brands fa-apple"></i>
          <span>Continue with Apple</span>
        </button>
      </div>
    </form>

    <div class="links">
      <p>Don't have an account?</p>
      <a id="signUpButton">Create one</a>
    </div>
  </div>

  <script type="module" src="../script/i18n.js"></script>
  <script src="../script/script.js"></script>
</body>
</html>
