<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f7f1">
    <meta name="description" content="Log in to your WalkTogether account.">
    <title>Log in — WalkTogether</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap">
    <link rel="stylesheet" href="../css/login.css">
    <script type="module" src="../script/auth.js"></script>
</head>
<body>
    <main class="login-shell">
        <a class="brand" href="main.html" aria-label="WalkTogether home">
            <span class="material-symbols-outlined brand-mark" aria-hidden="true">pets</span>
            WalkTogether Console
        </a>

        <section class="login-card" aria-labelledby="login-title">
            <p class="eyebrow">Good to have you back</p>
            <h1 id="login-title">Log in</h1>
            <p class="intro">Sign in to pick up where you left off.</p>

            <div id="signInMessage" class="message" role="alert" aria-live="polite" hidden></div>

            <form id="signInForm">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required>

                <button class="button" id="submitSignIn" type="submit">Log in</button>
            </form>

            <div class="separator"><span>or continue with</span></div>
            <div class="provider-buttons">
                <button class="provider-button provider-google" id="googleLogin" type="button">
                    <svg aria-hidden="true" viewBox="0 0 48 48" width="18" height="18">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.74 7.18l7.73 6C44.43 37.93 46.98 31.7 46.98 24.55Z"/>
                        <path fill="#FBBC05" d="M10.53 28.59a14.4 14.4 0 0 1 0-9.18l-7.98-6.19a23.9 23.9 0 0 0 0 21.56l7.98-6.19Z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.14 1.44-4.88 2.3-8.18 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"/>
                    </svg>
                    <span>Sign in with Google</span>
                </button>
                <button class="provider-button provider-apple" id="appleLogin" type="button">
                    <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
                        <path fill="currentColor" d="M16.37 1.43c0 1.14-.41 2.23-1.09 3.1-.73.93-1.94 1.64-3.1 1.55-.15-1.11.44-2.28 1.12-3.03.75-.86 2.05-1.52 3.07-1.62ZM20.9 17.1c-.42.96-.62 1.39-1.16 2.24-.75 1.18-1.81 2.65-3.12 2.66-1.17.01-1.47-.76-3.06-.75-1.59.01-1.92.76-3.09.75-1.31-.01-2.32-1.34-3.07-2.51-2.1-3.3-2.32-7.18-1.02-9.24.92-1.46 2.37-2.31 3.74-2.31 1.4 0 2.28.77 3.43.77 1.11 0 1.79-.77 3.41-.77 1.22 0 2.52.66 3.44 1.8-3.02 1.66-2.53 5.98.5 7.36Z"/>
                    </svg>
                    <span>Sign in with Apple</span>
                </button>
            </div>

            <p class="signup-prompt">New to WalkTogether? <a href="signup.html">Create an account</a></p>
            <a class="back-link" href="main.html">Back to WalkTogether</a>
        </section>
    </main>
</body>
</html>
