<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f7f1">
    <meta name="description" content="Log in to your WalkTogether account.">
    <title>Log in — WalkTogether</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="../css/login.css">
    <script type="module" src="../script/auth.js"></script>
</head>
<body>
    <main class="login-shell">
        <a class="brand" href="main.html" aria-label="WalkTogether home">
            <span class="material-symbols-outlined brand-mark" aria-hidden="true">pets</span>
            WalkTogether Console
        </a>

        <section class="login-card" aria-labelledby="login-title">
            <p class="eyebrow">Good to have you back</p>
            <h1 id="login-title">Log in</h1>
            <p class="intro">Sign in to pick up where you left off.</p>

            <div id="signInMessage" class="message" role="alert" aria-live="polite" hidden></div>

            <form id="signInForm">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required>

                <button class="button" id="submitSignIn" type="submit">Log in</button>
            </form>

            <div class="separator"><span>or continue with</span></div>
            <div class="provider-buttons">
                <button class="button button-outline" id="googleLogin" type="button">Google</button>
                <button class="button button-outline" id="appleLogin" type="button">Apple</button>
            </div>

            <a class="back-link" href="main.html">Back to WalkTogether</a>
        </section>
    </main>
</body>
</html>
