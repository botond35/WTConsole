<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages – WT Console</title>
  <link rel="stylesheet" href="../css/tailwind-built.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/settings.css">
  <link rel="stylesheet" href="../css/wt-dark.css">
  <script src="../script/wt-theme.js"></script>
  <script src="../script/wt-domain.js"></script>
</head>
<body class="bg-gray-50 font-sans">

<!-- ═══════════════════ FULL-PAGE SKELETON ═══════════════════ -->
<div id="skeletonScreen" class="flex h-screen overflow-hidden">
  <aside class="w-64 bg-white border-r border-gray-100 flex flex-col justify-between shadow-sm flex-shrink-0">
    <div>
      <div class="px-7 py-5 border-b border-gray-100">
        <div class="skel" style="width:120px;height:20px;margin-bottom:8px;"></div>
        <div class="skel" style="width:90px;height:12px;"></div>
      </div>
      <nav class="px-3 py-5 space-y-2">
        <div class="skel" style="height:38px;border-radius:12px;"></div>
        <div class="skel" style="height:38px;border-radius:12px;"></div>
        <div class="skel" style="height:38px;border-radius:12px;"></div>
        <div class="skel" style="height:38px;border-radius:12px;"></div>
        <div class="skel" style="height:38px;border-radius:12px;"></div>
        <div class="skel" style="height:38px;border-radius:12px;"></div>
        <div class="skel" style="height:38px;border-radius:12px;"></div>
      </nav>
    </div>
    <div class="p-3 border-t border-gray-100">
      <div class="flex items-center gap-3 bg-gray-50 p-3 rounded-xl">
        <div class="skel" style="width:36px;height:36px;border-radius:50%;flex-shrink:0;"></div>
        <div class="min-w-0 flex-1">
          <div class="skel" style="width:80px;height:13px;margin-bottom:6px;"></div>
          <div class="skel" style="width:60px;height:11px;"></div>
        </div>
      </div>
    </div>
  </aside>

  <main class="flex-1 overflow-hidden flex flex-col bg-gray-50 p-6">
    <div class="flex items-center justify-between mb-5">
      <div>
        <div class="skel" style="width:130px;height:26px;margin-bottom:10px;"></div>
        <div class="skel" style="width:190px;height:14px;"></div>
      </div>
      <div class="skel" style="width:120px;height:42px;border-radius:12px;"></div>
    </div>

    <div class="flex-1 flex gap-0 bg-white border border-gray-100 rounded-2xl overflow-hidden shadow-sm">
      <div style="width:320px;flex-shrink:0;border-right:1px solid #f0f0ec;">
        <div style="padding:16px 20px;border-bottom:1px solid #f0f0ec;"><div class="skel" style="width:60px;height:14px;"></div></div>
        <div style="padding:14px 16px;border-bottom:1px solid #f9fafb;display:flex;gap:10px;"><div class="skel" style="width:30px;height:20px;flex-shrink:0;"></div><div style="flex:1;"><div class="skel" style="width:70%;height:13px;margin-bottom:6px;"></div><div class="skel" style="width:90%;height:11px;"></div></div></div>
        <div style="padding:14px 16px;border-bottom:1px solid #f9fafb;display:flex;gap:10px;"><div class="skel" style="width:30px;height:20px;flex-shrink:0;"></div><div style="flex:1;"><div class="skel" style="width:70%;height:13px;margin-bottom:6px;"></div><div class="skel" style="width:90%;height:11px;"></div></div></div>
        <div style="padding:14px 16px;border-bottom:1px solid #f9fafb;display:flex;gap:10px;"><div class="skel" style="width:30px;height:20px;flex-shrink:0;"></div><div style="flex:1;"><div class="skel" style="width:70%;height:13px;margin-bottom:6px;"></div><div class="skel" style="width:90%;height:11px;"></div></div></div>
        <div style="padding:14px 16px;border-bottom:1px solid #f9fafb;display:flex;gap:10px;"><div class="skel" style="width:30px;height:20px;flex-shrink:0;"></div><div style="flex:1;"><div class="skel" style="width:70%;height:13px;margin-bottom:6px;"></div><div class="skel" style="width:90%;height:11px;"></div></div></div>
      </div>
      <div style="flex:1;padding:24px;">
        <div class="skel" style="width:200px;height:18px;margin-bottom:10px;"></div>
        <div class="skel" style="width:140px;height:13px;margin-bottom:20px;"></div>
        <div class="skel" style="width:95%;height:13px;margin-bottom:8px;"></div>
        <div class="skel" style="width:85%;height:13px;margin-bottom:8px;"></div>
        <div class="skel" style="width:60%;height:13px;"></div>
      </div>
    </div>
  </main>
</div>

<!-- ═══════════════════ REAL APP VIEW ═══════════════════ -->
<div id="appView" class="flex h-screen overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-64 bg-white border-r border-gray-100 flex flex-col justify-between shadow-sm flex-shrink-0">
    <div>
      <div class="px-7 py-5 border-b border-gray-100">
        <div class="flex items-center gap-2">
          <div>
            <h1 class="text-xl font-bold tracking-tight text-gray-900">WT Console</h1>
            <p class="text-xs text-gray-400">Vet & Dog Walking</p>
          </div>
        </div>
      </div>
      <nav class="px-3 py-5 space-y-1">
        <a href="home.html"     class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-gray-100 text-gray-600 text-sm font-medium transition"><span class="material-symbols-rounded text-[20px]">dashboard</span>Dashboard</a>
        <a href="clients.html"  class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-gray-100 text-gray-600 text-sm font-medium transition"><span class="material-symbols-rounded text-[20px]">pets</span>Clients</a>
        <a href="bookings.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-gray-100 text-gray-600 text-sm font-medium transition"><span class="material-symbols-rounded text-[20px]">event</span>Bookings</a>
        <a href="plans.html"    class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-gray-100 text-gray-600 text-sm font-medium transition"><span class="material-symbols-rounded text-[20px]">folder_open</span>Plans</a>
        <a href="invoices.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-gray-100 text-gray-600 text-sm font-medium transition"><span class="material-symbols-rounded text-[20px]">receipt_long</span>Invoices</a>
        <a href="messages.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl bg-black text-white text-sm font-medium shadow-sm">
          <span class="material-symbols-rounded text-[20px]">mail</span>Messages
          <span id="unreadCount" style="display:none;margin-left:auto;background:#ef4444;color:white;font-size:10px;font-weight:600;padding:1px 6px;border-radius:20px;"></span>
        </a>
        <a href="analytics.html"class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-gray-100 text-gray-600 text-sm font-medium transition"><span class="material-symbols-rounded text-[20px]">analytics</span>Analytics</a>
        <a href="settings.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-gray-100 text-gray-600 text-sm font-medium transition"><span class="material-symbols-rounded text-[20px]">settings</span>Settings</a>
      </nav>
    </div>
    <div class="p-3 border-t border-gray-100">
      <div class="flex items-center gap-3 bg-gray-50 p-3 rounded-xl">
        <div class="w-9 h-9 rounded-full bg-black text-white flex items-center justify-center font-bold text-xs flex-shrink-0 font-mono" id="sidebarAvatar">—</div>
        <div class="min-w-0">
          <p class="font-semibold text-gray-900 text-sm truncate" id="sidebarName">Loading…</p>
          <p class="text-xs text-gray-400">Administrator</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 overflow-hidden flex flex-col bg-gray-50 p-6">

    <!-- Header -->
    <div class="flex items-center justify-between mb-5">
      <div>
        <h2 class="text-2xl font-semibold text-gray-900 tracking-tight">Messages</h2>
        <p class="text-sm text-gray-400 mt-0.5">Booking requests and notes</p>
      </div>
      <button onclick="openNoteModal()" class="flex items-center gap-2 bg-black text-white text-sm font-medium px-4 py-2.5 rounded-xl hover:bg-gray-800 transition shadow-sm">
        <span class="material-symbols-rounded text-[18px]">edit_note</span>New Note
      </button>
    </div>

    <!-- Split pane -->
    <div class="msgs-layout flex-1">

      <!-- List pane -->
      <div class="msg-pane flex flex-col">
        <div class="msg-pane-header">
          <span class="msg-pane-title">Inbox</span>
        </div>
        <div id="msgList" class="flex-1 overflow-y-auto"></div>
      </div>

      <!-- Detail pane -->
      <div class="msg-detail-pane" id="msgDetail">
        <div class="detail-empty" style="height:100%;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:14px;">
          <div style="text-align:center;">
            <div style="font-size:40px;margin-bottom:12px;"><span class="material-symbols-rounded" style="vertical-align:middle;">inbox</span></div>
            <p>Select a message to read it</p>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- New Note Modal -->
<div id="noteModal" class="modal-overlay hidden">
  <div class="modal-box" style="max-width:440px;">
    <div class="modal-header">
      <span class="modal-title">New Note</span>
      <button class="modal-close" onclick="closeNoteModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field-group">
        <label class="field-label">Title</label>
        <input id="noteTitle" class="field-input" placeholder="e.g. Reminder about Buddy's vaccination">
      </div>
      <div class="field-group">
        <label class="field-label">Note</label>
        <textarea id="noteBody" class="field-textarea" style="min-height:120px;" placeholder="Write your note here…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeNoteModal()">Cancel</button>
      <button class="btn-primary" id="saveNoteBtn" onclick="saveNote()">Save Note</button>
    </div>
  </div>
</div>

<script type="module" src="../script/i18n.js"></script>
<script type="module" src="../script/homepage.js"></script>
<script type="module" src="../script/messages.js"></script>
<script src="../script/wt-workspace.js"></script>
</body>
</html>
